{% extends 'base.html' %}
{% load static %}
{% block content %}

		<article class="blog-post px-3 py-5 p-md-5">
		    <div class="container">

			  <h1 class="title mb-2">Delete comment/reply</h1>
			  <form method="post">
			  {% csrf_token %}
			  {{ form.as_p }}
			  <p>Are you want to delete this comment/reply?</p>
			  <input type="submit" value="Yes">

			  </form>
			  <a href="{% url 'blog:blog_detail' slug=object.post.slug %}">Cancel</a>
				
		    </div><!--//container-->
	    </article>

{% endblock content %}
