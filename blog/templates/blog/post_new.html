{% extends 'base.html' %}
{% load static %}
{% block content %}

<article class="blog-post px-3 py-5 p-md-5">
    <div class="container">
        <h1 class="title mb-2">New post</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                {{ form.title.label_tag }} {{ form.title }}<br>
                {{ form.cover.label_tag }} {{ form.cover }}<br>
                {{ form.tags.label_tag }} {{ form.tags }}<br>
            </div>

            <div class="form-group">
                <label for="body">Body:</label>
                <!-- Toggle HTML Editing Mode Button -->
                <button type="button" id="toggle-html" class="btn btn-secondary">Switch to HTML</button>
                
                <!-- Quill editor container -->
                <div id="editor" style="height: 200px;"></div>
                
                <!-- Hidden textarea to store raw HTML when switching modes -->
                <textarea id="html-editor" style="display: none; width: 100%; height: 200px;"></textarea>
                
                <!-- Hidden input to store the final Quill content -->
                <input type="hidden" name="body" id="body" required>
            </div>

            <input type="submit" value="Create">
        </form>
    </div><!--//container-->
</article>

<!-- Include Quill JS and CSS -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
// Initialize Quill editor
var quill = new Quill('#editor', {
    theme: 'snow',
    modules: {
        toolbar: [
            [{ 'header': [1, 2, false] }],
            ['bold', 'italic', 'underline'],
            [{ 'list': 'ordered' }, { 'list': 'bullet' }],
            ['link', 'image', 'video'],
            [{ 'color': [] }, { 'background': [] }],
            [{ 'align': [] }],
            ['clean'],
            ['blockquote', 'code-block'],
            ['table'],
            ['undo', 'redo'],
            ['emoji']
        ]
    }
});

var isHtmlMode = false;

// Toggle between Quill and HTML editor
$('#toggle-html').on('click', function() {
    if (isHtmlMode) {
        // Switch back to Quill mode
        var htmlContent = $('#html-editor').val();
        quill.clipboard.dangerouslyPasteHTML(htmlContent);
        $('#editor').show();
        $('#html-editor').hide();
        $(this).text('Switch to HTML');
    } else {
        // Switch to HTML mode
        var quillContent = quill.root.innerHTML;
        $('#html-editor').val(quillContent);
        $('#editor').hide();
        $('#html-editor').show();
        $(this).text('Switch to Quill');
    }
    isHtmlMode = !isHtmlMode;
});

// Handle form submission
$('form').on('submit', function(event) {
    var bodyContent;
    if (isHtmlMode) {
        bodyContent = $('#html-editor').val(); // Get content from HTML editor
    } else {
        bodyContent = quill.root.innerHTML; // Get content from Quill
    }
    $('#body').val(bodyContent); // Set the hidden input's value
});
</script>

{% endblock content %}
