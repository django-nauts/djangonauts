{% extends 'base.html' %}
{% load static %}
{% block content %}

<article class="blog-post px-3 py-5 p-md-5">
    <div class="container">
        <h1 class="title mb-2">New post</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                {{ form.title.label_tag }} {{ form.title }}<br>
                {{ form.cover.label_tag }} {{ form.cover }}<br>
                {{ form.tags.label_tag }} {{ form.tags }}<br>
            </div>

            <div class="form-group">
                <label for="body">Body:</label>
                <!-- Quill editor container -->
                <div id="editor" style="height: 200px;"></div>
                <!-- Hidden input to store the Quill editor content -->
                <input type="hidden" name="body" id="body" required>
            </div>

            <input type="submit" value="Create">
        </form>
    </div><!--//container-->
</article>

<!-- Include Quill JS and CSS -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    // Initialize Quill editor
    var quill = new Quill('#editor', {
        theme: 'snow'
    });

    // Handle form submission
    $('form').on('submit', function(event) {
        // Get HTML content from Quill editor
        var bodyContent = quill.root.innerHTML;
        // Set the hidden input value
        $('#body').val(bodyContent);
    });
</script>

{% endblock content %}
