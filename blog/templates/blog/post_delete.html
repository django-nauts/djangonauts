{% extends 'base.html' %}
{% load static %}
{% block content %}

		    <div class="container">

				<h1 class="title mb-2">Delete post</h1>
				<form method="post" enctype="multipart/form-data">
				{% csrf_token %}
				{{ form.as_p }}

				</form>
				
		    </div><!--//container-->
	    </article>

{% endblock content %}
